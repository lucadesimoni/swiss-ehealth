[project]
name = "swiss-ehealth"
version = "0.5.0"
description = "Swiss e-health patient dossier: AHVN13-derived UIDs, capability tokens, tamper-evident change tracking"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "argon2-cffi>=23",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
# The production driver. Kept optional so a development checkout and the test
# suite's SQLite default need no PostgreSQL client library, but the Docker
# image and CI both install it — production is PostgreSQL, and the config
# refuses to start on SQLite there.
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Generated by alembic from a template; reformatting them would churn files
# that must stay byte-identical to what ran on every existing database.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # outdated idioms
    "B",            # bugbear: mutable defaults, shadowed loop vars
    "S",            # bandit: the ones that matter in a health record
    "RUF",
]
ignore = [
    "S101",  # assert: the test suite is built on it
    "E501",  # line length is the formatter's job, not a lint error
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately use weak keys, fixed secrets and predictable values;
# flagging them would train everyone to ignore the category.
"tests/*" = ["S105", "S106", "S107", "S311"]
# The audit action names are TOKEN_ISSUED, TOKEN_REJECTED and so on. The rule
# matches on the name, not the value, and every one of these is an enum member.
"src/ehealth/models/audit.py" = ["S105"]
"src/ehealth/security/crypto.py" = ["S105"]
# These three shell out to git, always with literal arguments and never with
# anything derived from a request. Resolving `git` through PATH is deliberate:
# it is what makes the code work in a container, a CI runner and a developer's
# checkout alike. Scoped to these files so a future subprocess call elsewhere
# is still flagged.
"src/ehealth/version.py" = ["S603", "S607"]
"src/ehealth/scripts/record_release.py" = ["S603", "S607"]
"tests/test_releases.py" = ["S603", "S607"]

[tool.pytest.ini_options]
# "." is not redundant. Several test modules import shared constants from
# `tests.conftest`, which resolves only when the repository root is on the
# path. `python -m pytest` puts it there implicitly and a bare `pytest` does
# not, so without this the suite passes through `make test` and fails for
# anyone — CI included — who runs pytest directly.
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:ehealth.*"]
