#
# The database URL is deliberately absent: it comes from EHEALTH_DATABASE_URL
# via migrations/env.py, so there is exactly one place a connection string
# lives and no way to migrate the wrong database by editing the wrong file.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Revision filenames sort chronologically, so `ls` shows the real order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
