# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What this pipeline exists to prevent: claims in the README that nobody has
# checked. Before it, "runs on PostgreSQL" and "the image builds" were both
# true only as far as anyone had bothered to try. Each job below turns one of
# those into something that fails loudly when it stops being true.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3
        with:
          args: check
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3
        with:
          args: format --check

  # The code this repository ships includes everything it installs. This job
  # fails on a known vulnerability in any locked runtime dependency, on a
  # lockfile that no longer matches pyproject.toml, and publishes a CycloneDX
  # SBOM so a deployment can state exactly what it runs.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install "pip-audit>=2.7" "uv>=0.5"
      - name: The lockfile matches pyproject.toml
        run: |
          uv pip compile pyproject.toml --extra postgres --extra server \
            --generate-hashes --python-version 3.12 --python-platform x86_64-manylinux_2_28 \
            --no-header -o /tmp/requirements.lock
          diff -u requirements.lock /tmp/requirements.lock || {
            echo "requirements.lock is stale: run make lock and commit it"; exit 1; }
      - name: No known vulnerabilities in runtime dependencies
        run: pip-audit --require-hashes --disable-pip -r requirements.lock
      - name: Software bill of materials
        run: pip-audit --require-hashes --disable-pip -r requirements.lock -f cyclonedx-json -o sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The release ledger verifies entries against the commits they name,
          # which a shallow clone cannot resolve. Without this the checks skip
          # themselves and the job passes without having verified anything.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ehealth
          POSTGRES_PASSWORD: ehealth
          POSTGRES_DB: ehealth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ehealth -d ehealth"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EHEALTH_TEST_DATABASE_URL: postgresql+psycopg://ehealth:ehealth@localhost:5432/ehealth
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,postgres]"

      # The whole suite against the engine production actually uses. SQLite
      # cannot see a JSONB mismatch, a reserved word, or a stricter
      # transactional rule; this is where those surface.
      - name: Test suite on PostgreSQL
        run: pytest -q

      # A separate, plain `alembic upgrade head` — not through pytest — because
      # that is the command an operator runs, and it has its own failure modes
      # (config parsing, the advisory lock, the URL coming from settings).
      - name: Migrate a real database from empty
        env:
          EHEALTH_DATABASE_URL: postgresql+psycopg://ehealth:ehealth@localhost:5432/ehealth
        run: |
          alembic upgrade head
          alembic current
          # Idempotent: running it twice must be a no-op, which is what every
          # redeploy does.
          alembic upgrade head

      # A short load test on its own database: it fails on any request error
      # or on a ledger chain that no longer verifies after concurrent writes.
      # Its data then feeds the restore rehearsal, so the backup being proven
      # is one with thousands of real, signed ledger entries in it.
      - name: Load test, then prove a backup restores
        env:
          PGPASSWORD: ehealth
        run: |
          export EHEALTH_ROOT_KEY="$(python -c 'from ehealth.config import generate_root_key; print(generate_root_key())')"
          psql -h localhost -U ehealth -d ehealth -c "create database loadsrc" -c "create database loaddst"
          SRC=postgresql+psycopg://ehealth:ehealth@localhost:5432/loadsrc
          DST=postgresql+psycopg://ehealth:ehealth@localhost:5432/loaddst
          EHEALTH_DATABASE_URL=$SRC alembic upgrade head
          python -m ehealth.scripts.load_test --database-url "$SRC" --patients 15 --workers 6 --seconds 15
          python -m ehealth.scripts.restore_rehearsal --source "$SRC" --target "$DST"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: false
          load: true
          tags: swiss-ehealth:ci
          build-args: |
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles. This proves the thing inside it runs, and
      # that the provenance the pipeline stamped actually reached the image —
      # every audit entry it writes will carry that revision.
      - name: The image runs and reports its build
        run: |
          docker run --rm --entrypoint python swiss-ehealth:ci -c "
          from ehealth.version import release_identity
          identity = release_identity()
          print(identity.as_dict())
          assert identity.revision.startswith('${{ github.sha }}'[:7]), identity.revision
          "

      - name: It runs as a non-root user
        run: |
          test "$(docker run --rm --entrypoint id swiss-ehealth:ci -u)" = "10001"
